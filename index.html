<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b2340">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Кот-экзорцист</title>
  <style>
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
    html, body { margin: 0; height: 100%; background: #1d1729; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: var(--sat) var(--sar) var(--sab) var(--sal); }
    canvas { display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script src="src/game.js"></script>
</body>
</html>
